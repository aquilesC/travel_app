# Puts the media volume on the external hard drive.
# Enable by adding to .env:
#   COMPOSE_FILE=compose.yaml:compose.hd.yaml
#   MEDIA_HOST_PATH=/mnt/trips-media
# See README "Moving media to the external drive" before switching.
volumes:
  media:
    name: travel_app_media_hd
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MEDIA_HOST_PATH:?set MEDIA_HOST_PATH in .env}
