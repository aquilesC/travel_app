{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="narrow">
  <h1>{{ title }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="primary">Save</button>
    <a href="{{ cancel_url }}">Cancel</a>
  </form>
</section>
{% endblock %}
