{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Change password</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="primary">Change password</button>
    <a href="{% url 'account' %}">Cancel</a>
  </form>
</section>
{% endblock %}
