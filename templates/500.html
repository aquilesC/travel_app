<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something broke · Trips</title>
  <style>
    :root { --bg:#faf8f5; --fg:#1f2328; --muted:#6b7280; --accent:#0f766e; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg:#15171a; --fg:#e8e6e3; --muted:#9ca3af; --accent:#2dd4bf; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
           font:17px/1.55 Georgia, serif; padding:16px; box-sizing:border-box; text-align:center; }
    h1 { font-family: system-ui, sans-serif; }
    p { color: var(--muted); max-width: 30em; margin: 0 auto 1em; }
    a { color: var(--accent); font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div>
    <svg width="96" height="96" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="6"/><path d="M60 18 70 60H50Z" fill="#fb7185"/><path d="M60 102 50 60h20Z" fill="currentColor" fill-opacity=".5"/></svg>
    <h1>We hit a bump in the road</h1>
    <p>Something went wrong on our side. Your trips are safe; try again in a minute.</p>
    <p><a href="/">Back to Trips</a></p>
  </div>
</body>
</html>
