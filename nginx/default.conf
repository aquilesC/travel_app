upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Upload chunks are at most 50 MB (see static/js/upload.js); GPX up to 50 MB.
    client_max_body_size 60m;

    # Media files are never public: Django checks access and answers with
    # X-Accel-Redirect: /protected/<path>, which nginx serves from the volume.
    location /protected/ {
        internal;
        alias /app/media/;
        add_header Cache-Control "private, max-age=86400";
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        # Cloudflare/cloudflared set X-Forwarded-Proto; pass it through unchanged.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
    }
}
